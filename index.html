<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jali Lattice</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
    }
    #controls {
      width: 280px;
      padding: 24px;
      background: #242424;
      border-right: 1px solid #333;
      overflow-y: auto;
      height: 100vh;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    .subtitle { font-size: 12px; color: #888; margin-bottom: 24px; }
    .control-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }
    input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      background: #444;
      border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      background: #333;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
    }
    .value-display { font-size: 12px; color: #ccc; margin-top: 4px; }
    button {
      width: 100%;
      padding: 12px 16px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:hover { background: #e0e0e0; }
    button.secondary { background: #333; color: #fff; border: 1px solid #444; }
    button.secondary:hover { background: #444; }
    .divider { height: 1px; background: #333; margin: 24px 0; }
    #canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    canvas { box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    .color-row { display: flex; gap: 8px; margin-top: 8px; }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .color-swatch:hover, .color-swatch.active { border-color: #fff; }
    .shortcuts { font-size: 10px; color: #666; margin-top: 16px; line-height: 1.6; }
    .shortcuts kbd { padding: 2px 6px; background: #333; border-radius: 3px; margin-right: 4px; }
    .seed-row { display: flex; gap: 8px; }
    .seed-row input { flex: 1; }
    .seed-row button { width: auto; padding: 8px 16px; margin: 0; }
    .preset-btn {
      padding: 4px 8px;
      font-size: 11px;
      background: #333;
      color: #fff;
      border: 1px solid #444;
      border-radius: 3px;
      cursor: pointer;
    }
    .preset-btn:hover { background: #444; }
    .preset-btn .delete {
      margin-left: 4px;
      color: #888;
    }
    .preset-btn .delete:hover { color: #f55; }
  </style>
</head>
<body>
  <div id="controls">
    <h1>Jali Lattice</h1>
    <p class="subtitle">Flow field generative lattice</p>

    <div class="control-group">
      <label>Seed</label>
      <div class="seed-row">
        <input type="number" id="seed" value="42">
        <button id="generate">New</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Grid Size</label>
      <input type="range" id="gridSize" min="3" max="12" value="6">
      <div class="value-display"><span id="gridValue">6</span></div>
    </div>

    <div class="control-group">
      <label>Line Density</label>
      <input type="range" id="diagonalProb" min="0" max="1" step="0.05" value="0.7">
      <div class="value-display"><span id="diagValue">70%</span></div>
    </div>

    <div class="control-group">
      <label>Line Weight</label>
      <input type="range" id="lineWeight" min="1" max="6" step="0.5" value="2.5">
      <div class="value-display"><span id="weightValue">2.5px</span></div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Flow / Curve</label>
      <input type="range" id="imperfection" min="0" max="1" step="0.025" value="0.05">
      <div class="value-display"><span id="imperfectValue">5%</span></div>
    </div>

    <div class="control-group">
      <label>Wobble</label>
      <input type="range" id="wobble" min="0" max="0.1" step="0.005" value="0.02">
      <div class="value-display"><span id="wobbleValue">2%</span></div>
    </div>

    <div class="control-group">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="connected" style="width: auto;">
        <span style="text-transform: none; letter-spacing: 0;">Connected Lines</span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Sunburst</label>
      <input type="range" id="sunburst" min="0" max="1" step="0.05" value="0">
      <div class="value-display"><span id="sunburstValue">0%</span></div>
    </div>

    <div class="control-group">
      <label>Sunburst Spread</label>
      <input type="range" id="sunburstSpread" min="0" max="1" step="0.05" value="0.5">
      <div class="value-display"><span id="spreadValue">50%</span></div>
    </div>

    <div class="control-group">
      <label>Frozen Fountain</label>
      <input type="range" id="fountain" min="0" max="1" step="0.05" value="0">
      <div class="value-display"><span id="fountainValue">0%</span></div>
      <label style="margin-top: 8px; display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="sideFountains" style="width: auto;">
        <span style="text-transform: none; letter-spacing: 0;">Side Arches (Gateway)</span>
      </label>
      <div style="margin-top: 8px;">
        <label style="font-size: 10px;">Side Height</label>
        <input type="range" id="sideFountainHeight" min="0.2" max="1" step="0.1" value="0.5">
        <span id="sideHeightValue" style="font-size: 11px;">50%</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Colors</label>
      <div class="color-row">
        <div class="color-swatch active" style="background: #1a1a1a" data-bg="#1a1a1a" data-fg="#f5f0e6"></div>
        <div class="color-swatch" style="background: #f5f0e6" data-bg="#f5f0e6" data-fg="#1a1a1a"></div>
        <div class="color-swatch" style="background: #0a3d62" data-bg="#0a3d62" data-fg="#f8c291"></div>
        <div class="color-swatch" style="background: #0240E4" data-bg="#0240E4" data-fg="#f5f0e6"></div>
        <div class="color-swatch" style="background: #ffffff" data-bg="#ffffff" data-fg="#000000"></div>
      </div>
    </div>

    <div class="divider"></div>

    <button id="exportSVG">Export SVG</button>
    <button id="exportPNG" class="secondary">Export PNG</button>

    <div class="divider"></div>

    <div class="control-group">
      <label>Presets</label>
      <button id="savePreset" class="secondary">Save Current</button>
      <div id="presetList" style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px;"></div>
    </div>

    <div class="shortcuts">
      <kbd>Space</kbd> / <kbd>G</kbd> Generate<br>
      <kbd>S</kbd> Export SVG<br>
      <kbd>P</kbd> Export PNG
    </div>
  </div>

  <div id="canvas-container"></div>

  <script src="sketch.js"></script>
</body>
</html>
