<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jali Line Machine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
    }

    #controls {
      width: 280px;
      padding: 24px;
      background: #242424;
      border-right: 1px solid #333;
      overflow-y: auto;
      height: 100vh;
    }

    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #fff; }
    .subtitle { font-size: 12px; color: #888; margin-bottom: 24px; }

    .control-group { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      background: #444;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      background: #333;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
      font-family: monospace;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      cursor: pointer;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #ccc;
      cursor: pointer;
    }

    .value-display {
      font-size: 12px;
      color: #ccc;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s;
    }

    button:hover { background: #e0e0e0; }

    button.secondary {
      background: #333;
      color: #fff;
      border: 1px solid #444;
      font-weight: 500;
    }

    button.secondary:hover { background: #444; }

    .divider { height: 1px; background: #333; margin: 24px 0; }

    #canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    canvas { box-shadow: 0 4px 24px rgba(0,0,0,0.4); }

    .color-row { display: flex; gap: 8px; margin-top: 8px; }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .color-swatch:hover, .color-swatch.active { border-color: #fff; }

    .shortcuts {
      font-size: 10px;
      color: #666;
      margin-top: 16px;
      line-height: 1.6;
    }

    .shortcuts kbd {
      display: inline-block;
      padding: 2px 6px;
      background: #333;
      border-radius: 3px;
      font-family: inherit;
      margin-right: 4px;
    }

    .seed-row { display: flex; gap: 8px; }
    .seed-row input { flex: 1; }
    .seed-row button { width: auto; padding: 8px 16px; margin: 0; }
  </style>
</head>
<body>
  <div id="controls">
    <h1>Jali Machine</h1>
    <p class="subtitle">Line grid pattern generator</p>

    <div class="control-group">
      <label>Seed</label>
      <div class="seed-row">
        <input type="number" id="seed" value="42">
        <button id="generate">New</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Grid Size</label>
      <input type="range" id="gridSize" min="3" max="12" value="6">
      <div class="value-display"><span id="gridValue">6</span> x <span id="gridValue">6</span></div>
    </div>

    <div class="control-group">
      <label>Connection Density</label>
      <input type="range" id="connectionProb" min="0.3" max="1" step="0.05" value="0.7">
      <div class="value-display"><span id="connValue">70%</span></div>
    </div>

    <div class="control-group">
      <label class="checkbox-label">
        <input type="checkbox" id="diagonals" checked>
        Include Diagonals
      </label>
    </div>

    <div class="control-group">
      <label>Star Decorations</label>
      <input type="range" id="starNodes" min="0" max="0.6" step="0.05" value="0.3">
      <div class="value-display"><span id="starValue">30%</span></div>
    </div>

    <div class="control-group">
      <label>Line Weight</label>
      <input type="range" id="lineWeight" min="1" max="8" step="0.5" value="3">
      <div class="value-display"><span id="weightValue">3px</span></div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Imperfection</label>
      <input type="range" id="imperfection" min="0" max="1" step="0.05" value="0">
      <div class="value-display"><span id="imperfectValue">0%</span></div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Colors</label>
      <div class="color-row">
        <div class="color-swatch active" style="background: #1a1a1a" data-bg="#1a1a1a" data-fg="#f5f0e6"></div>
        <div class="color-swatch" style="background: #f5f0e6" data-bg="#f5f0e6" data-fg="#1a1a1a"></div>
        <div class="color-swatch" style="background: #0a3d62" data-bg="#0a3d62" data-fg="#f8c291"></div>
        <div class="color-swatch" style="background: #ffffff" data-bg="#ffffff" data-fg="#000000"></div>
      </div>
    </div>

    <div class="divider"></div>

    <button id="exportSVG">Export SVG</button>
    <button id="exportPNG" class="secondary">Export PNG</button>

    <div class="shortcuts">
      <kbd>Space</kbd> / <kbd>G</kbd> Generate<br>
      <kbd>S</kbd> Export SVG<br>
      <kbd>P</kbd> Export PNG
    </div>
  </div>

  <div id="canvas-container"></div>

  <script src="sketch.js"></script>
</body>
</html>
