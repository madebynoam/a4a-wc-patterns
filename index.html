<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jali Pattern Machine</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
    }

    #controls {
      width: 280px;
      padding: 24px;
      background: #242424;
      border-right: 1px solid #333;
      overflow-y: auto;
      height: 100vh;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }

    .subtitle {
      font-size: 12px;
      color: #888;
      margin-bottom: 24px;
    }

    .control-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      background: #444;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      cursor: pointer;
    }

    input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      background: #333;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
      font-family: monospace;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: #666;
    }

    .value-display {
      font-size: 12px;
      color: #ccc;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    button {
      width: 100%;
      padding: 12px 16px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s;
    }

    button:hover {
      background: #e0e0e0;
    }

    button.secondary {
      background: #333;
      color: #fff;
      border: 1px solid #444;
      font-weight: 500;
    }

    button.secondary:hover {
      background: #444;
    }

    .divider {
      height: 1px;
      background: #333;
      margin: 24px 0;
    }

    #canvas-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    canvas {
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .color-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .color-swatch:hover,
    .color-swatch.active {
      border-color: #fff;
    }

    .shortcuts {
      font-size: 10px;
      color: #666;
      margin-top: 16px;
      line-height: 1.6;
    }

    .shortcuts kbd {
      display: inline-block;
      padding: 2px 6px;
      background: #333;
      border-radius: 3px;
      font-family: inherit;
      margin-right: 4px;
    }

    .seed-row {
      display: flex;
      gap: 8px;
    }

    .seed-row input {
      flex: 1;
    }

    .seed-row button {
      width: auto;
      padding: 8px 12px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="controls">
    <h1>Jali Machine</h1>
    <p class="subtitle">Cellular pattern generator</p>

    <div class="control-group">
      <label>Seed</label>
      <div class="seed-row">
        <input type="number" id="seed" value="42">
        <button id="generate" title="Generate new pattern">New</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Density</label>
      <input type="range" id="density" min="3" max="8" value="5">
      <div class="value-display"><span id="densityValue">5</span> cells</div>
    </div>

    <div class="control-group">
      <label>Wall Thickness</label>
      <input type="range" id="wallThickness" min="0.08" max="0.35" step="0.01" value="0.15">
      <div class="value-display"><span id="wallValue">15%</span></div>
    </div>

    <div class="control-group">
      <label>Roundness</label>
      <input type="range" id="roundness" min="0" max="1" step="0.05" value="0.5">
      <div class="value-display"><span id="roundValue">50%</span></div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Human Hand (Imperfection)</label>
      <input type="range" id="imperfection" min="0" max="1" step="0.05" value="0">
      <div class="value-display"><span id="imperfectValue">0%</span> <span style="color:#666">(0% = pin, 50% = tote)</span></div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <label>Colors</label>
      <div class="color-row">
        <div class="color-swatch" style="background: #1a1a1a" data-bg="#1a1a1a" data-fg="#f5f0e6" title="Dark/Cream"></div>
        <div class="color-swatch active" style="background: #f5f0e6" data-bg="#f5f0e6" data-fg="#1a1a1a" title="Cream/Dark"></div>
        <div class="color-swatch" style="background: #0a3d62" data-bg="#0a3d62" data-fg="#f8c291" title="Blue/Gold"></div>
        <div class="color-swatch" style="background: #ffffff" data-bg="#ffffff" data-fg="#000000" title="White/Black"></div>
      </div>
    </div>

    <div class="divider"></div>

    <button id="exportSVG">Export SVG</button>
    <button id="exportPNG" class="secondary">Export PNG</button>

    <div class="shortcuts">
      <kbd>Space</kbd> or <kbd>G</kbd> Generate<br>
      <kbd>S</kbd> Export SVG<br>
      <kbd>P</kbd> Export PNG
    </div>
  </div>

  <div id="canvas-container">
  </div>

  <script src="sketch.js"></script>
</body>
</html>
